version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: coarc-postgres-db
    restart: always
    environment:
      POSTGRES_DB: coarc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: coarc-api-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=coarc_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PORT=5000
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: coarc-web-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
